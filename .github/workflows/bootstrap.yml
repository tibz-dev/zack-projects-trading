name: Bootstrap Zack Projects website

on:
  push:
    paths:
      - ".bootstrap/ready"

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Expand production source
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/project.zip.b64.part-* | base64 --decode > /tmp/zack-projects.zip
          rm -rf /tmp/zack-projects-extracted
          mkdir -p /tmp/zack-projects-extracted
          unzip -q /tmp/zack-projects.zip -d /tmp/zack-projects-extracted
          git rm -rf .
          cp -a /tmp/zack-projects-extracted/zack-projects-trading/. .

      - name: Commit production source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: build Zack Projects and Trading website"
          git push origin HEAD:main
